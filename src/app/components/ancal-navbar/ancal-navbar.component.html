@let pages = pagesResource.value();

<!-- Desktop top logo bar (not fixed, above sticky nav) -->
<div class="hidden lg:block border-b-[length:var(--nb-border-width)] border-[color:var(--nb-border)] bg-[var(--nb-background)]">
  <a [routerLink]="'/'">
    <div class="max-w-[1200px] mx-auto px-6 py-4 flex items-center gap-8">
      <picture>
        <source srcset="assets/images/white-logo.png" media="(prefers-color-scheme: dark)">
        <img id="img-logo" src="assets/images/logo.png" alt="Street Surf Club">
      </picture>
      <img id="img-logo-icon" src="assets/images/logo-icon.png" alt="" class="z-1">
    </div>
  </a>
</div>

<!-- Spacer for when desktop navbar becomes fixed -->
<div class="h-[80px]" [class]="spacerClasses()"></div>

<!-- Navbar: always fixed on mobile, relative→fixed on desktop -->
<header
  class="left-0 right-0 z-[991] fixed top-0 bg-[var(--nb-background)] border-b-[length:var(--nb-border-width)] border-[color:var(--nb-border)]"
  [class]="navbarClasses()">

  <div class="max-w-[1200px] mx-auto px-4 sm:px-6">
    <div class="h-20 flex items-center justify-between">

      <!-- Mobile logo / desktop sticky logo -->
      <a [routerLink]="'/'" (click)="onStickyLogoClick($event)">
        <picture class="lg:hidden">
          <source srcset="assets/images/white-logo.png" media="(prefers-color-scheme: dark)">
          <img src="assets/images/logo.png" alt="Street Surf Club" class="h-10 w-auto">
        </picture>
        <img
          src="assets/images/logo-icon.png"
          alt="Street Surf Club"
          class="h-10 w-auto"
          [class.hidden]="!isSticky()"
          [class.lg:block]="isSticky()">
      </a>

      <!-- Desktop nav links -->
      @if (pages && pages.length > 0) {
      <nav class="hidden lg:flex items-center gap-1">
        <a [routerLink]="'/blog'"
           nbButton
           tone="default"
           class="font-black! uppercase tracking-widest! text-xs!">
          Neues
        </a>
        @for (page of pages; track page.id) {
          <a [routerLink]="'/blog/blog-details/page/' + page.id"
             nbButton
             tone="default"
             class="font-black! uppercase tracking-widest! text-xs!"
             (click)="menuOpen = false">
            <span [innerHTML]="page.title | safeHtml"></span>
          </a>
        }
      </nav>
      }

      <!-- Mobile hamburger -->
      <button
        type="button"
        title="Menu"
        class="lg:hidden border-[3px] border-current p-2 cursor-pointer"
        (click)="toggleMenu()">
        @if (menuOpen) {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square">
            <path d="M6 6L18 18M6 18L18 6"/>
          </svg>
        } @else {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square">
            <path d="M3 4H21M3 12H21M3 20H21"/>
          </svg>
        }
      </button>
    </div>

    <!-- Mobile dropdown menu -->
    @if (menuOpen) {
    <div class="lg:hidden border-t-[length:var(--nb-border-width)] border-[color:var(--nb-border)] bg-[var(--nb-background)] pb-6">
      <nav class="flex flex-col gap-2 pt-4">
        <a [routerLink]="'/blog'"
           nbButton
           tone="default"
           class="font-black! uppercase tracking-widest! text-xs! w-full! justify-start!"
           (click)="menuOpen = false">
          Neues
        </a>
        @for (page of pages; track page.id) {
          <a [routerLink]="'/blog/blog-details/page/' + page.id"
             nbButton
             tone="default"
             class="font-black! uppercase tracking-widest! text-xs! w-full! justify-start!"
             (click)="menuOpen = false">
            <span [innerHTML]="page.title | safeHtml"></span>
          </a>
        }
      </nav>
    </div>
    }
  </div>
</header>
