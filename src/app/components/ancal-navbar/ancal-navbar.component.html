@let pages = pagesResource.value();

<!-- Desktop logo strip (not fixed) -->
<div class="hidden lg:flex items-center bg-surface-nav py-[2px] px-[12px] lg:px-[30px] xl:px-[40px] 2xl:px-[80px] 3xl:px-[120px]">
  <a [routerLink]="'/'" class="flex-1 flex items-center justify-center gap-6 lg:gap-10 xl:gap-14 2xl:gap-18">
    <picture class="z-1">
      <source srcset="assets/images/white-logo.png" media="(prefers-color-scheme: dark)">
      <img id="img-logo" src="assets/images/logo.png" alt="logo">
    </picture>
    <img id="img-logo-icon" src="assets/images/logo-icon.png" class="z-1" alt="logo">
  </a>
  <!-- Expanding search -->
  <div class="nav-search-bar">
    <i class="ri-search-line"></i>
    <input
      #navSearch
      type="text"
      (keydown.enter)="submitNavSearch(navSearch.value, navSearch)"
      (keydown.escape)="navSearch.value = ''; navSearch.blur()"
      placeholder="Suchen…">
  </div>
</div>

<!-- Spacer for fixed navbar -->
<div class="h-[80px]" [class]="spacerClasses()"></div>

<!-- Fixed navbar: always fixed on mobile, sticky on desktop when scrolled -->
<div
  class="navbar-area py-[10px] md:py-[12px] 2xl:py-[14px] bg-surface-nav left-0 right-0 z-[991] fixed top-0"
  [class]="navbarClasses()"
  data-aos-disable="true">
  <div
    class="mx-auto px-[12px] 2xl:max-w-[1920px] 2xl:px-[80px] 3xl:px-[120px]">
    <nav class="navbar relative lg:flex flex-wrap"
      [class.active]="menuOpen"
      [class.stickymode]="isSticky()">

      <!-- Mobile: logo + hamburger -->
      <div class="flex items-center justify-between w-full lg:hidden">
        <a [routerLink]="'/'" class="text-center px-4">
          <picture>
            <source srcset="assets/images/white-logo.png" media="(prefers-color-scheme: dark)">
            <img src="assets/images/logo.png" alt="logo">
          </picture>
        </a>
        <button title="menu"
          class="navbar-toggler-sticky lg:hidden z-[1000]"
          (click)="toggleMenu()"
          type="button">
          <span class="burger-menu cursor-pointer">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-body">
              <path d="M3 4H21M3 12H21M3 20H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
      </div>

      <!-- Desktop: nav items -->
      <div class="navbar-collapse flex self-center grow basis-auto items-center w-full">
        @if(pages && pages.length > 0) {
          <ul class="navbar-nav self-center flex-row lg:my-[6px] lg:mt-[4px] xl:mt-[6px] 2xl:mt-[8px] lg:flex w-full justify-between">
            <li
              class="nav-item text-center text-[12px] xl:text-[14px] 2xl:text-[16px] font-semibold leading-none mt-[32px] lg:mt-0 px-[5px] xl:px-[10px] 2xl:px-[14px]"
              [routerLink]="'/blog'"
              (click)="menuOpen = false">
              <span class="nav-link text-body relative z-1 cursor-pointer whitespace-nowrap">
                Neues
              </span>
            </li>
            @for (page of pages; track page.id) {
              <li
                class="nav-item text-center text-[12px] xl:text-[14px] 2xl:text-[16px] font-semibold leading-none mt-[32px] lg:mt-0 first:mt-0 px-[5px] xl:px-[10px] 2xl:px-[14px]"
                [routerLink]="'/blog/blog-details/page/' + page.id"
                (click)="menuOpen = false">
                <span [innerHTML]="page.title | safeHtml"
                  class="nav-link text-body relative z-1 cursor-pointer whitespace-nowrap">
                </span>
              </li>
            }
            <li class="md:hidden">
              <a [routerLink]="'/'" (click)="onStickyLogoClick($event)" class="w-30 -mt-12 py-2 block ">
                <img id="img-logo-sticky" src="assets/images/logo-icon.png" [class]="isSticky() ? 'hidden lg:block' : 'hidden'" alt="logo">
              </a>
            </li>
          </ul>
        }
      </div>
    </nav>
  </div>
</div>
