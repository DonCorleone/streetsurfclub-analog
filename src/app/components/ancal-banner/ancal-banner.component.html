<!-- Brutalist hero section -->
<section class="border-b-[length:var(--nb-border-width)] border-[color:var(--nb-border)] bg-[var(--nb-background)]">
  <div class="max-w-[1200px] mx-auto px-4 sm:px-6 py-12 md:py-16 lg:py-20">

    @if (isLoading()) {
      <app-loading-skeleton type="banner" />
    } @else if (parsedContent()) {

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-16 items-center"
         [class.animate-fade-up]="parsedContent()">

      <!-- Left: text content -->
      <div class="flex flex-col gap-6">
        @if (parsedContent()?.lead) {
        <div>
          <span nbChip tone="yellow" shadow="default" border="default" class="uppercase font-black! tracking-widest! text-xs!">
            {{ parsedContent()!.lead }}
          </span>
        </div>
        }

        <h1 class="text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-black leading-[1.02] uppercase"
            [innerHTML]="parsedContent()!.title | safeHtml">
        </h1>

        <div class="text-base md:text-lg leading-relaxed text-[var(--nb-foreground)] opacity-80 [&_*]:text-inherit"
             [innerHTML]="parsedContent()!.content | safeHtml">
        </div>

        <div>
          <a [routerLink]="'/blog'" nbButton tone="yellow" shadow="default" class="font-black! uppercase tracking-widest! text-sm!">
            Alle Beiträge →
          </a>
        </div>
      </div>

      <!-- Right: hero image -->
      @if (parsedContent()?.headerImg) {
      <div>
        <img
          [src]="parsedContent()!.headerImg"
          alt="Street Surf Club"
          class="w-full h-auto border-[length:var(--nb-border-width)] border-[color:var(--nb-border)] shadow-[5px_5px_0px_var(--nb-shadow)]"
          fetchpriority="high"
          loading="eager">
      </div>
      }

    </div>

    }
  </div>
</section>

<!-- Brutalist marquee strip -->
<nb-marquee
  duration="12s"
  class="border-b-[length:var(--nb-border-width)] border-[color:var(--nb-border)] bg-[var(--nb-yellow)] text-black!">
  @for (item of marqueeItems; track $index) {
    <nb-marquee-item class="font-black! uppercase tracking-widest! text-sm!">
      {{ item }}
    </nb-marquee-item>
  }
</nb-marquee>
